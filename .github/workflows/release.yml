name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        name: Resolve release version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$EVENT_TAG"
            prerelease=false
          else
            tag="$INPUT_TAG"
            prerelease="$INPUT_PRERELEASE"
          fi

          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Release tags must begin with v followed by a digit (for example, v0.1.0)." >&2
            exit 1
          fi

          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, osx-x64, osx-arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish ${{ matrix.rid }}
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/publish/$RID"

          dotnet publish ClaudeCodeCliHarness.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            --output "$publish_dir" \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:Version="$VERSION" \
            -p:InformationalVersion="$VERSION"

          test -f "$publish_dir/bridge/src/agent-bridge.mjs"
          test -f "$publish_dir/bridge/package.json"
          test -f "$publish_dir/bridge/package-lock.json"
          if find "$publish_dir" \( -name appsettings.Local.json -o -name gateway-settings.local.json \) -print -quit | grep -q .; then
            echo "Local configuration was included in the release package." >&2
            exit 1
          fi

          asset="claudecodeh5-${{ needs.prepare.outputs.tag }}-$RID.zip"
          (
            cd "$publish_dir"
            zip -qr "$GITHUB_WORKSPACE/$asset" .
          )

      - name: Upload ${{ matrix.rid }} package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: claudecodeh5-${{ needs.prepare.outputs.tag }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create checksums
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum "claudecodeh5-${TAG}-"*.zip | sort > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          assets=(release-assets/*.zip release-assets/SHA256SUMS.txt)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi

          release_args=("$TAG" "${assets[@]}" --generate-notes)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_args+=(--target "$TARGET_SHA")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"